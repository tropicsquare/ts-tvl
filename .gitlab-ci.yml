stages:
  - test
  - build
  - deploy
  - publish


default:
  tags:
    - shell


.setup-env: &setup-env
  cache:
    - key:
        files:
          - poetry.lock
      paths:
        - .venv
  before_script:
    - which uv || curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - python3.8 -m venv .venv
    - source .venv/bin/activate
    - uvx poetry config virtualenvs.in-project true
    - uvx poetry install --no-root --no-interaction --with=dev


tests:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.8", "3.12", "3.14"]
  cache:
    - key: "venv-python${PYTHON_VERSION}-${CI_COMMIT_REF_SLUG}"
      paths:
        - .venv-${PYTHON_VERSION}
  before_script:
    - which uv || curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv venv --python ${PYTHON_VERSION} --clear .venv-${PYTHON_VERSION}
    - export VIRTUAL_ENV="$(pwd)/.venv-${PYTHON_VERSION}"
    - export PATH="$VIRTUAL_ENV/bin:$PATH"
    - uvx poetry install --no-interaction --with=dev
  script:
    - uvx poetry run pytest -v --color=no
        --junit-xml=results-${PYTHON_VERSION}.xml
        --cov-report=html:htmlcov-${PYTHON_VERSION}
  coverage: '/TOTAL\s+(?:\d+\s+){4}(\d+\.?\d+)%/'
  artifacts:
    when: always
    name: "tvl_coverage_python${PYTHON_VERSION}"
    paths:
      - htmlcov-${PYTHON_VERSION}
    expose_as: "tests coverage report"
    reports:
      junit: results-${PYTHON_VERSION}.xml


package:
  stage: build
  <<: *setup-env
  script:
    - uvx poetry build --format=wheel
  artifacts:
    paths:
      - dist/


install:
    stage: deploy
    when: manual
    needs:
        - job: package
          artifacts: true
    variables:
        TS_TVL_LOCATION: /tools/tropic/ts-tvl
    script:
        - GIT_REVISION=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
        - echo $GIT_REVISION

        - TS_TVL_SCRIPTS_LOCATION=$TS_TVL_LOCATION/$GIT_REVISION
        - echo $TS_TVL_SCRIPTS_LOCATION

        - TS_TVL_SCRIPTS_VENV=$TS_TVL_SCRIPTS_LOCATION/venv
        - echo $TS_TVL_SCRIPTS_VENV

        - TS_TVL_SCRIPTS_LNS=$TS_TVL_SCRIPTS_LOCATION/lns
        - echo $TS_TVL_SCRIPTS_LNS

        - mkdir -p $TS_TVL_SCRIPTS_LOCATION
        - python3.8 -m venv $TS_TVL_SCRIPTS_VENV
        - source $TS_TVL_SCRIPTS_VENV/bin/activate
        - pip install --upgrade pip
        - pip install --force-reinstall dist/*.whl

        - echo "$(git rev-parse --short HEAD)" > $TS_TVL_SCRIPTS_LOCATION/git_commit

        - mkdir -p $TS_TVL_SCRIPTS_LNS
        - ln -sf $TS_TVL_SCRIPTS_VENV/bin/api_generator $TS_TVL_SCRIPTS_LNS/api_generator
        - ln -sf $TS_TVL_SCRIPTS_VENV/bin/co_generator $TS_TVL_SCRIPTS_LNS/co_generator
        - ln -sf $TS_TVL_SCRIPTS_VENV/bin/model_server $TS_TVL_SCRIPTS_LNS/model_server
        - ln -sf $TS_TVL_SCRIPTS_VENV/lib/python3.8/site-packages/tvl $TS_TVL_SCRIPTS_LNS/tvl


variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_STRATEGY: clone

github_mirror:
    tags:
        - shell
    stage: publish
    when: always
    only:
      - public
    script:
      # Ensure we are on branch, not detached head
      - git checkout public

      # Use Proxy Github account "tropic-gitlab" to push to the github
      - git config --global user.email "tropic-gitlab@tropicsquare.com"
      - git config --global user.name "tropic-gitlab"

      # Add remote origin
      - git remote remove github || true
      - git remote add github git@github.com:tropicsquare/ts-tvl.git

      # Push - Use SSH key created for this purpose
      - GIT_SSH_COMMAND="ssh -i ~/.ssh/gitlab_mirror.id_rsa" git push github
      - GIT_SSH_COMMAND="ssh -i ~/.ssh/gitlab_mirror.id_rsa" git push github --follow-tags
